# application.yml

spring:
  application:
    name: flink-replication-service
  datasource:
    target:
      url: jdbc:postgresql://target-db-host:5432/target_db
      username: target_user
      password: target_password
      hikari:
        maximum-pool-size: 20
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        pool-name: TargetDBPool

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

replication:
  enabled: true
  max-retries: 5 # Максимальное количество попыток
  retry-delay-ms: 10000 # Задержка между попытками (мс)
  restart-on-failure: true # Автоматический перезапуск
  initial-delay-ms: 30000
  tables:
    - customers
    - orders
    - products
    - transactions
  batch-size: 500
  chunk-size: 1000
  source-databases:
    # Шаблон для 100 БД (пример первых 3, остальные аналогично)
    - name: source_db_1
      url: jdbc:postgresql://source-host-1:5432/source_db_1
      username: repl_user
      password: repl_password
      schema: public
      priority: 1
      active: true
      connection-pool:
        max-total: 10
        max-idle: 5
        min-idle: 2
        max-wait-ms: 10000
        validation-query: "SELECT 1"
        test-on-borrow: true

    - name: source_db_2
      url: jdbc:postgresql://source-host-2:5432/source_db_2
      username: repl_user
      password: repl_password
      schema: public
      priority: 1
      active: true
      connection-pool:
        max-total: 10
        max-idle: 5
        min-idle: 2
        max-wait-ms: 10000

    - name: source_db_3
      url: jdbc:postgresql://source-host-3:5432/source_db_3
      username: repl_user
      password: repl_password
      schema: public
      priority: 2
      active: true
      connection-pool:
        max-total: 10
        max-idle: 5
        min-idle: 2
        max-wait-ms: 10000

    # Остальные 97 БД...
    # Для генерации полного файла можно использовать скрипт

flink:
  job:
    name: pg-replication-job
    parallelism: 4
    checkpoint:
      interval: 60000 # Интервал между запусками (мс)
      timeout: 30000
      mode: EXACTLY_ONCE
    restart-strategy:
      fixed-delay:
        attempts: 3
        delay: 10000
    buffer-timeout: 100
    watermark-interval: 10000

logging:
  level:
    root: INFO
    org:
      apache:
        flink: INFO
      springframework:
        jdbc: WARN
      hikari: WARN
    com:
      example:
        flinkreplication: DEBUG
  file:
    name: logs/flink-replication.log
    max-size: 50MB
    max-history: 7
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"

alert:
  email:
    enabled: false
    recipients:
      - admin@example.com
    from: noreply@example.com
  slack:
    webhook-url: https://hooks.slack.com/services/...
    channel: "#alerts"