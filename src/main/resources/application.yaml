# application.yml

spring:
  application:
    name: flink-replication-service
  datasource:
    url: jdbc:postgresql://localhost:5432/target_db?currentSchema=postgres_metadata
    username: postgres
    password: kampus
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TargetDBPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: postgres_metadata

#  flyway:
#    enabled: true
#    baseline-on-migrate: true
#    locations: classpath:db/migration
#    url: jdbc:postgresql://localhost:5432/target_db?currentSchema=postgres_metadata
#    user: postgres
#    password: kampus


management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
    endpoint:
      health:
        show-details: always
    metrics:
      export:
        prometheus:
          enabled: true


replication:
  enabled: true
  max-retries: 5

  postgres:
    tables:
#      - pg_stat_statements
      - pg_catalog.pg_database
      - pg_catalog.pg_user
      - pg_catalog.pg_class
      - pg_catalog.pg_namespace
      - pg_partitioned_table
      - information_schema.columns
      - information_schema.tables
      - pg_policy
      - pg_catalog.pg_description
      - pg_catalog.pg_sequence
      - pg_catalog.pg_attrdef
      - pg_catalog.pg_attribute
      - pg_catalog.pg_type
      - pg_index
      - pg_catalog.pg_constraint
      - pg_am
      - pg_catalog.pg_enum

flink:
  job:
    name: pg-replication-job
    parallelism: 20
    max-retries: 3
    retry-delay-ms: 1000
    cron: "0 0 22 * * *"

    checkpoint:
      interval: 60000 # Интервал между запусками (мс)
      timeout: 30000
      mode: EXACTLY_ONCE
    restart-strategy:
      fixed-delay:
        attempts: 3
        delay: 10000
    buffer-timeout: 100
    watermark-interval: 10000


clean-database-logs:
# cron expression, to switch off put value '-'
  task-cleaner-schedule: 0 0 0 * * ?
# delete logs from db that older than X years
  clean-period: 3

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.engine.jdbc.connections.internal.DriverManagerConnectionProviderImpl: DEBUG
    org.apache.flink: INFO
    org.springframework.jdbc: WARN
    com.example.flinkreplication: DEBUG
  file:
    name: logs/flink-replication.log
    max-size: 50MB
    max-history: 7
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"