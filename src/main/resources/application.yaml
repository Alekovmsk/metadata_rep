# application.yml

spring:
  application:
    name: flink-replication-service
    version: 0.0.1-SNAPSHOT
    dpt: 912044
    dntdom: GPB
    user: test_user

  datasource:
    url: jdbc:postgresql://localhost:5432/target_db?currentSchema=postgres_metadata
    username: postgres
    password: kampus
    driverClassName: org.postgresql.Driver
    defaultSchema: postgres_metadata
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: TargetDBPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: postgres_metadata

  flyway:
    schemas: postgres_metadata
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://localhost:5432/target_db?currentSchema=postgres_metadata
    user: postgres
    password: kampus

  tomcat:
    max-connections: 100 # Максимальное количество соединений
    accept-count: 100 # Максимальное количество потоков
    threads:
      max: 50 # Размер очереди запросов

logs-database:
  enabled: true
  task-create-partition: 0 0 0 * * ?
  url: jdbc:postgresql://localhost:5432/log_db
  username: postgres
  password: kampus
  driverClassName: org.postgresql.Driver

clean-database-logs:
  # cron expression, to switch off put value '-'
  task-cleaner-schedule: 0 0 1 * * ?
  # delete logs from db that older than X years
  clean-period: 3

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
    endpoint:
      health:
        show-details: always
    metrics:
      export:
        prometheus:
          enabled: true


replication:
  enabled: true
  max-retries: 5
  depthStorage: 10 # Глубина хранения архива метаданных в днях
  postgres:
    tables:
#      - pg_stat_statements
      - pg_catalog.pg_database
      - pg_catalog.pg_user
      - pg_catalog.pg_class
      - pg_catalog.pg_namespace
      - pg_catalog.pg_partitioned_table
      - information_schema.columns
      - information_schema.tables
      - pg_catalog.pg_policy
      - pg_catalog.pg_description
      - pg_catalog.pg_sequence
      - pg_catalog.pg_attrdef
      - pg_catalog.pg_attribute
      - pg_catalog.pg_type
      - pg_catalog.pg_index
      - pg_catalog.pg_constraint
      - pg_catalog.pg_am
      - pg_catalog.pg_enum

flink:
  job:
    name: pg-replication-job
    parallelism: 20
    max-retries: 3
    retry-delay-ms: 1000

sources:
  connections:
    file-path: ${CONFIG_DIR:./config}/db-connections.json

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.engine.jdbc.connections.internal.DriverManagerConnectionProviderImpl: DEBUG
    org.apache.flink: INFO
    org.springframework.jdbc: WARN
    com.example.flinkreplication: DEBUG
  file:
    name: logs/flink-replication.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7